[project]
name = "spectralsvr"
version = "0.9.3"
description = "Add your description here"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.11.0,<4",
    "numpy>=2.4.6,<3",
    "pandas>=3.0.3,<4",
    "torch>=2.11.0,<3",
    "torchdiffeq>=0.2.5,<0.3",
    "torchmetrics>=1.9.0,<2",
    "torchvision>=0.26.0,<0.27",
    "tqdm>=4.68.4,<5",
    "torchkbnufft>=1.5.0,<2",
]
authors = [{ name = "nidduzzi", email = "74892632+nidduzzi@users.noreply.github.com" }]

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.3.0,<8",
    "ray[tune]>=2.56.0,<3",
    "hyperopt>=0.2.7,<0.3",
    "xarray>=2026.7.0,<2027",
    "zarr>=3.1.6,<4",
    "gcsfs>=2026.7.0,<2027",
    "ipywidgets>=8.1.8,<9",
    "scikit-learn>=1.9.0,<2",
]

lint = [
    "mypy>=2.2.0,<3",
    "ruff>=0.15.21,<0.16",
    "ty>=0.0.58,<0.1",
]
# neural-operator baselines to compare SpectralSVR against (DeepONet via deepxde,
# torch backend). Heavy + optional; not needed for the core library or tests.
baselines = [
    "deepxde>=1.14.0,<2",
]
test = [
    "memory-profiler>=0.61.0,<0.62",
    "pytest>=9.1.1,<10",
    "hypothesis>=6.156.6,<7",
    "coverage>=7.15.0,<8",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128"},
]
torchvision = [
  { index = "pytorch-cu128"},
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["SpectralSVR"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Surface warnings as errors so regressions are caught, but allowlist the
# known matplotlib/numpy copy-keyword deprecation raised during plotting.
filterwarnings = [
    "error",
    "ignore:.*__array__ implementation doesn't accept a copy keyword.*:DeprecationWarning",
    # torchkbnufft still uses torch.jit.script internally
    "ignore:.*torch.jit.script.* is deprecated.*:",
    "ignore:.*torch.jit.script.*:FutureWarning",
]

[tool.coverage.run]
source = ["SpectralSVR"]

[tool.coverage.report]
# Exclude code that cannot be exercised from tests: abstract-method bodies,
# typing overloads, and defensive guards that the coeff setter makes
# unreachable (it always stores a tensor, never None).
exclude_also = [
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
    "^\\s*\\.\\.\\.$",
    "class .*\\(.*Protocol.*\\):",
]

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["torchdiffeq.*", "torchkbnufft.*", "deepxde.*", "pandas.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W", "C9", "PERF"]

[tool.ruff.format]
quote-style = "double"
